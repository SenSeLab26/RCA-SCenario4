# Jaeger, deployed *inside* the cluster this time (Scenarios 1-3 ran it as a
# plain Docker container on the host).
#
# It is pinned to the dedicated infra node. Two reasons: our trace store must
# survive the node we are about to kill, and it must not compete for CPU with
# either the application tier or the control plane.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: rca4
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      nodeSelector:
        rca4-role: infra
      containers:
        - name: jaeger
          # Pinned rather than :latest so the in-memory storage cap below is
          # honoured and runs stay reproducible across machines.
          image: jaegertracing/all-in-one:1.57
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: "memory"
            # A 5-minute run at ~32 req/s is roughly 10,000 traces. The default
            # cap would silently evict the beginning of our recovery curve.
            - name: MEMORY_MAX_TRACES
              value: "80000"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
# In-cluster address the gateway and backend export their spans to.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: rca4
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: ui
      port: 16686
      targetPort: 16686
---
# Host access for the browser UI and for scripts/extract_data.py.
apiVersion: v1
kind: Service
metadata:
  name: jaeger-nodeport
  namespace: rca4
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 30686
